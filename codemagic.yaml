workflows:
  eplant-app-mobile-dev:
    name: E-Plantation Development
    max_build_duration: 120
    instance_type: mac_mini_m1
    cache:
      cache_paths:
        - ~/.gradle/caches
        - node_modules
    environment:
      groups:
        - eplant-credentials
      vars:
        PACKAGE_NAME: 'com.eplantation.mobile.app'
        ENV: 'dev'
      node: 20
      java: 17
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: development
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      
      - name: Setup keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/keystore.keystore
          cp /tmp/keystore.keystore android/app/production.keystore
      
      - name: Init Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$FCI_BUILD_DIR/android/local.properties"
      
      - name: Setup app config
        script: |
          chmod +x sag-dev
          ./sag-dev export dev --initiate-only
      
      - name: Bump version
        script: |
          npx react-native bump-version --type patch
      
      - name: Build Android APK
        script: |
          cd android
          ./gradlew clean
          ./gradlew assembleRelease
      
      - name: Generate release notes
        script: |
          git fetch --all --tags
          prev_tag=$(git for-each-ref --sort=-creatordate --format '%(objectname)' refs/tags | sed -n 2p)
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "E-Plantation Development v$APP_VERSION" > .bin/release-notes.txt
          echo "" >> .bin/release-notes.txt
          echo "Build: #$BUILD_NUMBER" >> .bin/release-notes.txt
          echo "Environment: Development" >> .bin/release-notes.txt
          echo "" >> .bin/release-notes.txt
          echo "Recent changes:" >> .bin/release-notes.txt
          if [ -n "$prev_tag" ]; then
            git log --pretty=format:"- %s" "$prev_tag"..HEAD >> .bin/release-notes.txt
          else
            git log -5 --pretty=format:"- %s" >> .bin/release-notes.txt
          fi
      
      - name: Push commit changes
        script: |
          APP_VERSION=$(node -p "require('./package.json').version")
          git config user.email "ci@codemagic.io"
          git config user.name "Codemagic CI"
          git add .
          git commit -m "[skip ci] bump version $APP_VERSION" || echo "No changes"
          git push https://$GITLAB_USERNAME:$GITLAB_PASSWORD@gitlab.sahabatagro.co.id/sahabat-agro-group/eplant-mobile.git HEAD:development || echo "Push failed"
    
    artifacts:
      - android/app/build/outputs/**/*.apk
      - .bin/release-notes.txt
    
    publishing:
      email:
        recipients:
          - developer@sahabatagro.co.id
        notify:
          success: true
          failure: true

